name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

env:
  DATABASE_URL: postgres://kostas:kostas@localhost:5432/kostas_dev
  AUTH_SECRET: ci-only-insecure-secret-not-for-production

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kostas
          POSTGRES_PASSWORD: kostas
          POSTGRES_DB: kostas_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kostas -d kostas_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20.9.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test-build
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kostas
          POSTGRES_PASSWORD: kostas
          POSTGRES_DB: kostas_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kostas -d kostas_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20.9.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Install Playwright browsers
        run: pnpm --filter @kostas/web exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm build

      - name: Run Playwright smoke tests
        run: pnpm --filter @kostas/web test:e2e
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
