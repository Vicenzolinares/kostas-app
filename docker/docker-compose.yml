name: kostas-app

services:
  postgres:
    # pgvector-enabled Postgres image (module 12: AI Photo Search uses the
    # `vector` extension for embedding similarity search). Drop-in
    # compatible with postgres:17-alpine otherwise.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: kostas
      POSTGRES_PASSWORD: kostas
      POSTGRES_DB: kostas_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kostas -d kostas_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
